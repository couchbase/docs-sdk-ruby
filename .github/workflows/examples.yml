name: Examples

on:
  push:
    branches:
      - release/3.*
      - temp/3.*

  pull_request:
    branches:
      - release/3.*
      - temp/3.*

jobs:
  check-syntax:
    name: Check Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - run: rake check_syntax
